name: music-transcription
x-app: &app
  build:
    context: .
    dockerfile: Containerfile
    target: runtime
  image: music-transcription-api:local
  environment: &environment
    DATABASE_URL: postgresql+psycopg://music:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres/music
    REDIS_URL: redis://redis:6379/0
    DATA_DIR: /data
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    MODEL_PYTHON: /opt/models-venv/bin/python
    DEMUCS_REPO: /models/demucs
    BASIC_PITCH_MODEL_PATH: /models/basic-pitch/nmp.onnx
    SOUNDFONT_PATH: /soundfonts/default.sf2
    MUSESCORE_BIN: musescore3
    INFERENCE_DEVICE: cpu
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
    STAGE_TIMEOUT_SECONDS: ${STAGE_TIMEOUT_SECONDS:-3600}
    LEASE_SECONDS: 120
    DISK_MIN_FREE_BYTES: ${DISK_MIN_FREE_BYTES:-1073741824}
    OMP_NUM_THREADS: 2
    OPENBLAS_NUM_THREADS: 2
    MKL_NUM_THREADS: 2
    HF_HUB_OFFLINE: 1
  volumes:
    - ${DATA_PATH:-./data}:/data
    - ${MODELS_PATH:-./models}:/models:ro
  networks: [private]
  init: true
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  tmpfs:
    - /tmp:size=512m,mode=1777
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    migrate: {condition: service_completed_successfully}

services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: music
      POSTGRES_USER: music
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U music -d music']
      interval: 10s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4.2-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10
  migrate:
    <<: *app
    command: [python, -m, app.cli, migrate]
    restart: 'no'
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  api:
    <<: *app
    command: [uvicorn, 'app.main:app', --host, 0.0.0.0, --port, '8000', --no-proxy-headers]
    healthcheck:
      test: [CMD, python, -m, app.cli, health, --role, api]
      interval: 30s
      timeout: 10s
      retries: 5
  worker:
    <<: *app
    image: music-transcription-worker-cpu:local
    build:
      context: .
      dockerfile: Containerfile
      target: worker-cpu
    command: [celery, -A, 'app.worker:celery_app', worker, --loglevel=INFO]
    healthcheck:
      test: [CMD, python, -m, app.cli, health, --role, worker]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
  dispatcher:
    <<: *app
    command: [python, -m, app.cli, dispatcher]
    healthcheck:
      test: [CMD, python, -m, app.cli, health, --role, dispatcher]
      interval: 30s
      timeout: 10s
      retries: 5
  web:
    build:
      context: .
      dockerfile: Containerfile
      target: web
    image: music-transcription-web:local
    ports: ['${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080']
    networks: [private, ingress]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

networks:
  private: {internal: true}
  ingress: {}
volumes:
  postgres-data: {}
  redis-data: {}
