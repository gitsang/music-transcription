services:
  worker:
    image: music-transcription-worker-gpu:local
    build:
      context: .
      dockerfile: Containerfile
      target: worker-gpu
    environment:
      INFERENCE_DEVICE: cuda
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
