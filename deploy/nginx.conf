server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # Docker's embedded DNS. Re-resolve the API so recreating the container
    # does not leave nginx pointed at a dead address (which surfaced as 502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Hard ingress ceiling: application administrators can choose up to 2 GiB.
    # The API enforces the actual configured upload-byte limit before spooling.
    client_max_body_size 2049m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    location = /healthz { access_log off; return 200 'ok'; }
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
    # User files are never mounted here and have no static/internal URL.
    location / { try_files $uri $uri/ /index.html; }
}
